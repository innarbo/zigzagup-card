<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#041326">
  <meta name="robots" content="noindex,follow">
  <title>Inna Arbo | ZigZagUp QR Card</title>
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height:100svh; margin:0; padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 24px); display:grid; place-items:center; color:white; background:radial-gradient(circle at 75% 10%,rgba(0,216,235,.18),transparent 38%),linear-gradient(155deg,#0a294b,#041326 48%,#020d1a); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,430px); text-align:center; }
    .logo { width:300px; max-width:88%; margin:0 auto 34px; }
    h1 { margin:0; font-size:clamp(2.6rem,12vw,3.4rem); line-height:1; letter-spacing:-.055em; }
    .role { margin:10px 0 30px; color:rgba(255,255,255,.72); font-size:1.08rem; }
    .qr { width:min(75vw,290px); margin:0 auto; padding:16px; border-radius:23px; background:white; box-shadow:0 0 34px rgba(0,216,235,.26),0 20px 45px rgba(0,0,0,.26); }
    .qr img { display:block; width:100%; }
    .scan { margin:22px 0 9px; font-size:1.02rem; }
    .url { color:#00d8eb; font-size:.78rem; }
    a { display:inline-flex; margin-top:25px; min-height:48px; align-items:center; justify-content:center; padding:0 20px; color:white; border:1px solid rgba(255,255,255,.25); border-radius:12px; text-decoration:none; background:rgba(255,255,255,.08); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./assets/brand/zigzagup-logo-tagline-dark.png" alt="ZigZagUp — Reasoning Calibration & Training">
    <h1>Inna Arbo</h1>
    <p class="role">Founder & CEO</p>
    <div class="qr"><img src="./assets/qr/zigzagup-card-qr.svg" alt="QR code for the permanent digital card address"></div>
    <p class="scan">Scan to connect</p>
    <div class="url">innarbo.github.io/zigzagup-card</div>
    <a href="./">Open digital card</a>
  </main>
</body>
</html>
